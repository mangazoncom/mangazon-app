<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gemini Quiz Royale</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script>
      window.process = { env: { API_KEY: '' } };
      window.onerror = function(m, s, l, c, e) {
        console.error("Global Error:", m, e);
        const ld = document.getElementById('loading-display');
        if(ld) ld.style.display = 'none';
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "peerjs": "https://esm.sh/peerjs@1.5.2?bundle",
    "react-qr-code": "https://esm.sh/react-qr-code@2.0.15?deps=react@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
      :root { --bg-color: #0f172a; }
      html, body { margin: 0; padding: 0; min-height: 100vh; background-color: var(--bg-color); color: #f8fafc; font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
      .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
      .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
      @keyframes countdown-pulse {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
      }
      .animate-countdown { animation: countdown-pulse 0.8s ease-out forwards; }
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      input[type=range] { -webkit-appearance: none; background: transparent; }
      input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #6366f1; cursor: pointer; margin-top: -8px; border: 2px solid #fff; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
      input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #334155; border-radius: 3px; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .typewriter::after { content: '|'; animation: cursor 1s infinite; }
      @keyframes cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="loading-display" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#0f172a]">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h2 class="text-xl font-bold text-white font-heading tracking-widest text-center uppercase">Gemini Quiz Royale</h2>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState, useEffect, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { GoogleGenAI, Type } from "@google/genai";
      import Peer from "peerjs";
      import QRCode from "react-qr-code";
      import { ArrowRight, BrainCircuit, Loader2, Users, Swords, UserCog, Laptop2, Crown, LogOut, Share2, SkipForward, Heart, ShieldAlert, Sparkles, Lightbulb, ExternalLink, ListChecks, Type as TypeIcon, Timer, TimerOff, Languages, Settings2, Copy } from 'lucide-react';

      const TRANSLATIONS = {
        ja: {
          appTitle: "Quiz Royale", tagline: "次世代 AI クイズバトル", solo: "ソロプレイ", host: "ロビー作成", join: "参加する",
          playerName: "あなたの名前", avatar: "アバター選択", apiKey: "API キー", roomId: "ルーム ID", start: "クイズ開始", battle: "バトル開始",
          topic: "クイズのお題", topicPlaceholder: "ジブリ, 歴史, 化学...", language: "使用言語", difficulty: "難易度設定", qCount: "問題数",
          format: "回答形式", choice: "4択問題", free: "記述式", countdown: "カウントダウン", mode: "ルール設定",
          unlimited: "無制限", death: "一撃死", lives: "ライフ制 (3回)", waiting: "接続中...", invite: "プレイヤーを招待", players: "参加者",
          question: "問題", submit: "送信", skip: "スキップ", correct: "正解！", failed: "不正解...", explanation: "解説", source: "出典元",
          finish: "終了", rematch: "もう一度挑戦", top: "メインメニュー", loading: "事実を調査中...", generating: "画像を生成中...",
          diffs: { 1: "初級", 2: "中級", 3: "上級", 4: "マニア", 5: "神レベル" }
        },
        en: {
          appTitle: "Quiz Royale", tagline: "Next-Gen AI Quiz Battle", solo: "Solo Play", host: "Host Lobby", join: "Join Game",
          playerName: "Player Name", avatar: "Avatar", apiKey: "API Key", roomId: "Room ID", start: "Start Quiz", battle: "Start Battle",
          topic: "Topic", topicPlaceholder: "History, Science, Movie...", language: "Language", difficulty: "Difficulty", qCount: "Questions",
          format: "Format", choice: "Choices", free: "Text", countdown: "Countdown", mode: "Rules",
          unlimited: "Unlimited", death: "1-Miss Death", lives: "3-Lives", waiting: "Connecting...", invite: "Invite Friends", players: "Players",
          question: "Question", submit: "Submit", skip: "Skip", correct: "CORRECT!", failed: "FAILED...", explanation: "Explanation", source: "Source",
          finish: "Finish", rematch: "Rematch", top: "Main Menu", loading: "Investigating Facts...", generating: "Generating Visuals...",
          diffs: { 1: "Easy", 2: "Medium", 3: "Hard", 4: "Expert", 5: "God Level" }
        }
      };

      const STORAGE_KEYS = { KEY: 'qr_api_key_v9', NAME: 'qr_name_v9', AVATAR: 'qr_avatar_v9', CONFIG: 'qr_config_v9' };
      const AVATARS = ['🐶', '🐱', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐸', '🐵', '🐧', '🐦', '🐥', '🐺', '🐴', '🦄', '🐙', '🦑', '🐠', '🐬', '🐳', '🦈', '🐘', '🦏', '🦒', '🦓', '🐉', '🐲', '🍎', '🍋', '🍉', '🍓', '🍒', '🥑', '🍕', '🍔', '🍦', '🍩', '⚽️', '🏀', '🎮', '🚀', '🌈', '🔥', '💎', '🍀'];

      const generateQuizData = async (config, onProgress, t) => {
        const apiKey = window.process.env.API_KEY || localStorage.getItem(STORAGE_KEYS.KEY);
        if (!apiKey) throw new Error("API Key required");
        
        const ai = new GoogleGenAI({ apiKey });
        onProgress(0, config.questionCount, t.loading);
        
        const isChoice = config.questionType === 'choice';
        const langStr = config.language === 'en' ? 'English' : 'Japanese';
        
        const prompt = `Topic:"${config.topic}" Difficulty:"${t.diffs[config.difficulty]}" Questions:${config.questionCount} Format:${isChoice ? "4-choice" : "Free text answer"} Language:${langStr}. Use googleSearch for maximum factual accuracy. Output JSON.`;

        const response = await ai.models.generateContent({
          model: 'gemini-3-flash-preview',
          contents: prompt,
          config: {
            tools: [{ googleSearch: {} }],
            responseMimeType: "application/json",
            responseSchema: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  question: { type: Type.STRING },
                  options: isChoice ? { type: Type.ARRAY, items: { type: Type.STRING } } : undefined,
                  correctIndex: isChoice ? { type: Type.INTEGER } : undefined,
                  acceptableAnswers: !isChoice ? { type: Type.ARRAY, items: { type: Type.STRING } } : undefined,
                  explanation: { type: Type.STRING },
                  imagePrompt: { type: Type.STRING }
                },
                required: ["question", "explanation"]
              }
            }
          }
        });
        
        let questions = JSON.parse(response.text);
        const sources = response.candidates?.[0]?.groundingMetadata?.groundingChunks?.map(c => c.web) || [];
        
        for (let i = 0; i < questions.length; i++) {
          onProgress(i, questions.length, t.generating);
          if (questions[i].imagePrompt) {
            try {
              const ir = await ai.models.generateContent({ 
                model: 'gemini-2.5-flash-image', 
                contents: { parts: [{ text: questions[i].imagePrompt }] },
                config: { imageConfig: { aspectRatio: "4:3" } }
              });
              const p = ir.candidates[0].content.parts.find(x => x.inlineData);
              if (p) questions[i].imageUrl = `data:${p.inlineData.mimeType};base64,${p.inlineData.data}`;
            } catch (err) { console.warn("Image gen failed", err); }
          }
        }
        return { questions, sources };
      };

      const useQuizGameLogic = (mode) => {
        const [status, setStatus] = useState('setup');
        const [players, setPlayers] = useState([]);
        const [myId, setMyId] = useState('');
        const [gameData, setGameData] = useState({ questions: [], config: null, sources: [] });
        const [winner, setWinner] = useState(null);
        const [nextTrigger, setNextTrigger] = useState(0);
        
        const peerRef = useRef(null);
        const connsRef = useRef([]);
        const hostConnRef = useRef(null);

        const initHost = (name, avatar) => {
          if (peerRef.current) peerRef.current.destroy();
          const p = new Peer(); peerRef.current = p;
          p.on('open', id => {
            setMyId(id);
            setPlayers([{ id, name, avatar, score: 0, isHost: true }]);
            setStatus('lobby');
          });
          p.on('connection', c => {
            c.on('open', () => {
              c.on('data', d => {
                if (d.type === 'JOIN') {
                  const np = { id: c.peer, name: d.name, avatar: d.avatar, score: 0, isHost: false };
                  setPlayers(prev => {
                    const up = [...prev, np];
                    c.send({ type: 'WELCOME', players: up, config: gameData.config });
                    connsRef.current.forEach(cx => cx.send({ type: 'UPDATE_PLAYERS', players: up }));
                    return up;
                  });
                } else if (d.type === 'WIN') broadcastWin(c.peer, d.name, d.idx, d.isSkip);
              });
            });
            connsRef.current.push(c);
          });
        };

        const joinRoom = (hostId, name, avatar) => {
          if (peerRef.current) peerRef.current.destroy();
          const p = new Peer(); peerRef.current = p;
          p.on('open', () => {
            const c = p.connect(hostId); hostConnRef.current = c;
            c.on('open', () => { c.send({ type: 'JOIN', name, avatar }); setStatus('lobby'); });
            c.on('data', d => {
              if (d.type === 'WELCOME' || d.type === 'UPDATE_CONFIG') setGameData(v => ({ ...v, config: d.config }));
              if (d.type === 'UPDATE_PLAYERS') setPlayers(d.players);
              if (d.type === 'START') { setGameData({ questions: d.qs, config: d.config, sources: d.src }); setStatus('playing'); }
              if (d.type === 'ROUND_END') { setWinner(d.winner); setPlayers(d.players); }
              if (d.type === 'NEXT') { setNextTrigger(v => v + 1); setWinner(null); }
            });
          });
        };

        const broadcastWin = (id, name, idx, isSkip = false) => {
          setPlayers(prev => {
            const up = isSkip ? prev : prev.map(p => p.id === id ? { ...p, score: p.score + 1 } : p);
            const w = { id, name, type: isSkip ? 'skip' : 'win' };
            setWinner(w);
            if (peerRef.current) connsRef.current.forEach(c => c.send({ type: 'ROUND_END', winner: w, players: up }));
            return up;
          });
        };

        const reset = () => { if (peerRef.current) peerRef.current.destroy(); setStatus('setup'); setPlayers([]); setGameData({ questions: [], config: null, sources: [] }); setWinner(null); };

        return { status, players, myId, gameData, winner, nextTrigger, setStatus, setPlayers, setMyId, initHost, joinRoom, reset,
          hostStart: (qs, config, src) => { 
            setGameData({ questions: qs, config, sources: src }); 
            setStatus('playing'); 
            if (peerRef.current) connsRef.current.forEach(c => c.send({ type: 'START', qs, config, src })); 
          },
          hostUpdate: c => { setGameData(v => ({ ...v, config: c })); if (peerRef.current) connsRef.current.forEach(cx => cx.send({ type: 'UPDATE_CONFIG', config: c })); },
          hostNext: () => { setNextTrigger(v => v + 1); setWinner(null); if (peerRef.current) connsRef.current.forEach(c => c.send({ type: 'NEXT' })); },
          claim: (idx, skip) => {
            const me = players.find(p => p.id === myId);
            if (mode === 'single') broadcastWin(myId, me?.name || 'Player', idx, skip);
            else hostConnRef.current?.send({ type: 'WIN', name: me?.name, idx, isSkip: skip });
          }
        };
      };

      const App = () => {
        const [view, setView] = useState('setup');
        const [mode, setMode] = useState('single');
        const [apiKey, setApiKey] = useState(localStorage.getItem(STORAGE_KEYS.KEY) || '');
        const [config, setConfig] = useState(() => {
          const s = localStorage.getItem(STORAGE_KEYS.CONFIG);
          return s ? JSON.parse(s) : { topic: '', difficulty: 3, questionCount: 5, incorrectMode: 'lives', useCountdown: true, questionType: 'choice', language: 'ja' };
        });
        const [load, setLoad] = useState({ c: 0, t: 0, m: '' });
        const gm = useQuizGameLogic(mode);
        const t = TRANSLATIONS[config.language];

        useEffect(() => { 
          const l = document.getElementById('loading-display'); if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 400); } 
          const params = new URLSearchParams(window.location.search); if (params.get('join')) setMode('guest');
        }, []);

        useEffect(() => { if (apiKey) { localStorage.setItem(STORAGE_KEYS.KEY, apiKey); window.process.env.API_KEY = apiKey; } }, [apiKey]);
        useEffect(() => { localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(config)); }, [config]);
        useEffect(() => { if (gm.status === 'playing') setView('quiz'); }, [gm.status]);

        const handleStartAI = async () => {
          if (!apiKey) return alert("API Key is required.");
          if (!config.topic) return alert("Please enter a topic.");
          setView('loading');
          try {
            const data = await generateQuizData(config, (c, tc, m) => setLoad({ c, t: tc, m }), t);
            gm.hostStart(data.questions, config, data.sources);
          } catch (e) { alert(e.message); setView(mode === 'single' ? 'single-config' : 'lobby'); }
        };

        const goTop = () => { gm.reset(); setView('setup'); };

        if (view === 'quiz') return <QuizView gm={gm} onFinish={() => setView('result')} t={t} />;
        if (view === 'result') return <ResultView gm={gm} onRematch={handleStartAI} onTop={goTop} t={t} />;
        if (view === 'loading') return <LoadingView load={load} />;

        return (
          <div className="min-h-screen flex flex-col p-4 md:p-10 animate-fade-in relative z-10">
            <header className="max-w-7xl mx-auto w-full flex justify-between items-center mb-10">
              <div className="flex items-center text-white font-black text-4xl font-heading tracking-tighter cursor-pointer" onClick={goTop}><BrainCircuit className="w-10 h-10 mr-4 text-indigo-500"/> {t.appTitle}</div>
              {view !== 'setup' && <button onClick={goTop} className="glass p-4 rounded-2xl text-slate-400 hover:text-white transition-all shadow-xl"><LogOut className="w-6 h-6"/></button>}
            </header>
            
            <main className="flex-1 flex flex-col items-center">
              {view === 'setup' ? (
                <SetupForm mode={mode} setMode={setMode} apiKey={apiKey} setApiKey={setApiKey} t={t} onAction={(name, avatar) => {
                  if (mode === 'single') {
                    const sid = 'solo-' + Math.random().toString(36).substr(2, 5);
                    gm.setMyId(sid);
                    gm.setPlayers([{ id: sid, name, avatar, score: 0, isHost: true }]);
                    setView('single-config');
                  } else if (mode === 'host') {
                    gm.initHost(name, avatar);
                    setView('lobby');
                  } else {
                    const rid = prompt(t.roomId); if (rid) { gm.joinRoom(rid, name, avatar); setView('lobby'); }
                  }
                }} />
              ) : (view === 'single-config' || view === 'lobby') ? (
                <ConfigView config={config} setConfig={setConfig} gm={gm} onStart={handleStartAI} t={t} isLobby={view === 'lobby'} mode={mode} />
              ) : null}
            </main>
          </div>
        );
      };

      const SetupForm = ({ mode, setMode, apiKey, setApiKey, onAction, t }) => {
        const [name, setName] = useState(localStorage.getItem(STORAGE_KEYS.NAME) || 'Player');
        const [avatar, setAvatar] = useState(localStorage.getItem(STORAGE_KEYS.AVATAR) || '🐶');
        useEffect(() => { localStorage.setItem(STORAGE_KEYS.NAME, name); localStorage.setItem(STORAGE_KEYS.AVATAR, avatar); }, [name, avatar]);

        return (
          <div className="glass max-w-xl w-full p-8 md:p-12 rounded-[3.5rem] shadow-2xl space-y-8 animate-fade-in relative overflow-hidden">
            <div className="absolute top-0 right-0 p-10 opacity-10 pointer-events-none"><BrainCircuit className="w-40 h-40 text-indigo-500 transform rotate-12"/></div>
            <div className="text-center"><h1 className="text-6xl font-black text-white italic tracking-tighter mb-2">{t.appTitle}</h1><p className="text-slate-500 text-[10px] font-black uppercase tracking-[0.5em]">{t.tagline}</p></div>
            <div className="flex bg-slate-800 p-1.5 rounded-[2rem] border border-slate-700/50">
              {[{id:'single',l:t.solo,i:UserCog},{id:'host',l:t.host,i:Laptop2},{id:'guest',l:t.join,i:Users}].map(m => (
                <button key={m.id} onClick={() => setMode(m.id)} className={`flex-1 py-4 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest flex flex-col items-center gap-2 transition-all ${mode === m.id ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-white'}`}><m.i className="w-5 h-5"/>{m.l}</button>
              ))}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.playerName}</label><input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white font-black outline-none focus:border-indigo-500 transition-all" /></div>
              <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.avatar}</label><div className="flex bg-slate-800 border border-slate-700 rounded-2xl p-2 overflow-x-auto gap-2 scrollbar-hide">{AVATARS.map(a => <button key={a} onClick={() => setAvatar(a)} className={`text-2xl p-2 rounded-xl transition-all ${avatar === a ? 'bg-indigo-600 shadow-xl scale-110' : 'hover:bg-slate-700'}`}>{a}</button>)}</div></div>
            </div>
            <div className="space-y-2"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.apiKey}</label><input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white font-mono text-xs focus:border-indigo-500 outline-none" placeholder="AIza..." /></div>
            <button onClick={() => onAction(name, avatar)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-6 rounded-[2rem] text-2xl transition-all shadow-2xl uppercase tracking-widest hover:scale-[1.02] active:scale-[0.98]">{mode === 'guest' ? t.join : mode === 'host' ? t.host : t.solo}</button>
          </div>
        );
      };

      const ConfigView = ({ config, setConfig, gm, onStart, t, isLobby, mode }) => {
        const isHost = gm.players.find(p => p.id === gm.myId)?.isHost;
        const sUrl = `${window.location.origin}${window.location.pathname}?join=${gm.myId}`;
        const update = c => { setConfig(c); if (isLobby) gm.hostUpdate(c); };

        return (
          <div className="glass max-w-2xl w-full p-8 md:p-12 rounded-[3.5rem] space-y-8 animate-fade-in shadow-2xl overflow-hidden relative">
            <div className="flex justify-between items-center relative z-10"><h2 className="text-3xl font-black text-white italic">{isLobby ? t.host : t.solo} {t.start.toUpperCase()}</h2><div className="flex gap-2 -space-x-2">{gm.players.map(p => <span key={p.id} className="text-3xl bg-slate-800 p-2 rounded-full border border-slate-700" title={p.name}>{p.avatar}</span>)}</div></div>
            
            {!isHost ? <div className="text-center py-20"><Loader2 className="w-20 h-20 animate-spin text-indigo-500 mx-auto mb-6"/><p className="text-white text-3xl font-black tracking-widest">{t.waiting}</p></div> : <>
              {isLobby && mode === 'host' && (
                <div className="bg-white/5 p-8 rounded-[3rem] border border-white/10 space-y-6">
                  <div className="flex flex-col items-center gap-6">
                    <div className="bg-white p-6 rounded-[2.5rem] shadow-2xl"><QRCode value={sUrl} size={160}/></div>
                    <div className="w-full space-y-4">
                      <div className="text-center"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{t.roomId}</span><div className="text-3xl font-mono font-black text-indigo-400 mt-1 select-all">{gm.myId}</div></div>
                      <div className="flex gap-3"><div className="flex-1 bg-slate-900/80 p-4 rounded-2xl text-[10px] text-slate-500 truncate font-mono border border-slate-800">{sUrl}</div><button onClick={() => {navigator.clipboard.writeText(gm.myId); alert("Room ID Copied");}} className="bg-indigo-600 p-4 rounded-2xl hover:bg-indigo-500 transition-all flex items-center justify-center"><Copy className="w-5 h-5 text-white"/></button></div>
                    </div>
                  </div>
                </div>
              )}
              
              <div className="space-y-6 bg-slate-800/40 p-8 rounded-[2.5rem] border border-slate-700 shadow-inner">
                <div className="space-y-2"><label className="flex items-center text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1"><Sparkles className="w-3 h-3 mr-2"/> {t.topic}</label><input type="text" value={config.topic} onChange={e => update({...config, topic: e.target.value})} className="w-full bg-slate-700 border border-slate-600 rounded-2xl p-4 text-white font-black focus:border-indigo-500 outline-none" placeholder={t.topicPlaceholder}/></div>
                <div className="grid grid-cols-2 gap-6">
                   <div className="space-y-2 flex flex-col"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.language}</label><button onClick={() => update({...config, language: config.language==='ja'?'en':'ja'})} className="w-full bg-slate-700 py-4 rounded-2xl border-2 border-slate-600 text-xs font-black uppercase tracking-widest">{config.language==='ja'?'日本語':'English'}</button></div>
                   <div className="space-y-2 flex flex-col"><div className="flex justify-between items-center"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.difficulty}</label><span className="text-indigo-400 font-black text-[10px]">{t.diffs[config.difficulty]}</span></div><input type="range" min={1} max={5} value={config.difficulty} onChange={e => update({...config, difficulty: parseInt(e.target.value)})} className="mt-2" /></div>
                </div>
                <div className="grid grid-cols-2 gap-6">
                   <div className="space-y-2 flex flex-col"><div className="flex justify-between items-center"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.qCount}</label><span className="text-indigo-400 font-black text-2xl font-heading leading-none">{config.questionCount}</span></div><input type="range" min={3} max={30} value={config.questionCount} onChange={e => update({...config, questionCount: parseInt(e.target.value)})} className="mt-2" /></div>
                   <div className="space-y-2 flex flex-col"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.format}</label><button onClick={() => update({...config, questionType: config.questionType==='choice'?'free':'choice'})} className="w-full bg-slate-700 py-4 rounded-2xl border-2 border-slate-600 text-xs font-black uppercase tracking-widest">{config.questionType==='choice'?t.choice:t.free}</button></div>
                </div>
                <div className="grid grid-cols-2 gap-6">
                   <div className="space-y-2 flex flex-col"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.countdown}</label><button onClick={() => update({...config, useCountdown: !config.useCountdown})} className={`w-full py-4 rounded-2xl border-2 text-xs font-black flex items-center justify-center transition-all ${config.useCountdown?'bg-indigo-600 border-indigo-500 shadow-lg':'bg-slate-700 border-slate-600 text-slate-400'}`}>{config.useCountdown ? <Timer className="w-4 h-4 mr-2"/> : <TimerOff className="w-4 h-4 mr-2"/>} {config.useCountdown?'ON':'OFF'}</button></div>
                   <div className="space-y-2 flex flex-col"><label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">{t.mode}</label><button onClick={() => update({...config, incorrectMode: config.incorrectMode==='lives'?'death':config.incorrectMode==='death'?'unlimited':'lives'})} className="w-full bg-slate-700 py-4 rounded-2xl border-2 border-slate-600 text-xs font-black uppercase tracking-widest">{t[config.incorrectMode]}</button></div>
                </div>
              </div>
              <button onClick={onStart} disabled={!config.topic} className="w-full bg-indigo-600 text-white font-black py-7 rounded-[2.5rem] text-3xl flex items-center justify-center gap-5 hover:scale-105 transition-all shadow-2xl shadow-indigo-500/40 active:scale-95 disabled:opacity-50 disabled:grayscale"><Swords className="w-10 h-10"/> {isLobby?t.battle:t.start}</button>
            </>}
          </div>
        );
      };

      const QuizView = ({ gm, onFinish, t }) => {
        const { questions, config, sources } = gm.gameData;
        const [idx, setIdx] = useState(0);
        const [val, setVal] = useState('');
        const [state, setState] = useState('playing'); 
        const [lives, setLives] = useState(config.incorrectMode==='lives'?3:1);
        const [cnt, setCnt] = useState(null);
        const cur = questions[idx];
        const isLast = idx === questions.length - 1;

        useEffect(() => { if (gm.winner) setState('result'); }, [gm.winner]);
        useEffect(() => {
          if (gm.nextTrigger > 0) {
            if (config.useCountdown) { setCnt(3); const timer = setInterval(() => setCnt(p => { if(p<=1){clearInterval(timer);adv();return null;} return p-1; }), 1000); }
            else adv();
          }
        }, [gm.nextTrigger]);

        const adv = () => { if(isLast)onFinish(); else{setIdx(i=>i+1); setVal(''); setLives(config.incorrectMode==='lives'?3:1); setState('playing');} };
        const check = i => { if(state!=='playing') return; if(i===cur.correctIndex) gm.claim(idx, false); else miss(); };
        const submitText = () => { if(state!=='playing'||!val.trim()) return; if(cur.acceptableAnswers.some(a=>a.toLowerCase().includes(val.trim().toLowerCase()))) gm.claim(idx, false); else {miss();setVal('');} };
        const miss = () => { if(config.incorrectMode==='death') gm.claim(idx, true); else if(config.incorrectMode==='lives'){const nl=lives-1;setLives(nl);if(nl<=0)gm.claim(idx, true);} };

        if (!cur) return null;

        return (
          <div className="w-full max-w-5xl mx-auto flex flex-col h-full relative p-4 animate-fade-in">
            {cnt!==null && <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 backdrop-blur-3xl"><div className="text-[14rem] font-black text-white animate-countdown font-heading">{cnt}</div></div>}
            <div className="mb-6 flex justify-between items-end">
              <div><span className="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">{config.topic}</span><h2 className="text-slate-500 mt-5 font-bold">{t.question} {idx+1} <span className="opacity-30">/ {questions.length}</span></h2></div>
              {config.incorrectMode==='lives' && state==='playing' && <div className="flex gap-2">{[...Array(3)].map((_,i)=><Heart key={i} className={`w-7 h-7 transition-all ${i<lives?'text-rose-500 fill-rose-500 drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]':'text-slate-800 scale-90 opacity-30'}`}/>)}</div>}
            </div>
            <div className="flex-1 glass rounded-[3.5rem] p-8 md:p-16 relative overflow-hidden flex flex-col justify-center min-h-[500px] shadow-2xl">
              {state==='result' && <div className={`absolute inset-0 z-20 flex flex-col items-center justify-center backdrop-blur-2xl animate-fade-in ${gm.winner.type==='win'?'bg-teal-900/50':'bg-rose-900/50'}`}><h2 className="text-7xl md:text-9xl font-black mb-10 italic tracking-tighter">{gm.winner.type==='win'?t.correct:t.failed}</h2><div className="bg-black/80 px-10 py-5 rounded-[2rem] border border-white/10 flex items-center mb-10"><span className="text-3xl mr-4">{gm.players.find(p=>p.id===gm.winner.id)?.avatar}</span><span className="font-black text-2xl">{gm.winner.name}</span></div>{gm.players.find(p=>p.id===gm.myId).isHost ? <button onClick={()=>gm.hostNext()} className="bg-white text-slate-900 px-14 py-6 rounded-[2rem] font-black text-2xl flex items-center hover:scale-105 transition-all active:scale-95">{isLast?t.finish:t.rematch} <ArrowRight className="ml-4 w-7 h-7"/></button> : <p className="text-white font-black animate-pulse tracking-[0.2em]">{t.waiting}</p>}</div>}
              <div className="text-center mb-10">{cur.imageUrl && <img src={cur.imageUrl} className="max-h-[300px] mx-auto rounded-3xl border border-slate-700 mb-8 shadow-2xl object-cover"/>}<h2 className="text-3xl md:text-5xl font-black text-white leading-tight typewriter tracking-tight">{cur.question}</h2></div>
              <div className="max-w-2xl mx-auto w-full space-y-6">
                {config.questionType==='choice' ? <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{cur.options.map((o,i)=><button key={i} onClick={()=>check(i)} disabled={state!=='playing'} className={`p-6 rounded-3xl border-2 text-left font-black transition-all ${state==='playing'?'bg-slate-800/40 border-slate-700 hover:border-indigo-500 hover:bg-slate-700 active:scale-95':'bg-slate-800/10 border-slate-800 grayscale opacity-40 blur-[1px]'}`}>{o}</button>)}</div> : <div className="flex bg-slate-800/80 rounded-[2.5rem] border-2 border-slate-700 p-2 focus-within:border-indigo-500 transition-all"><input type="text" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitText()} disabled={state!=='playing'} className="flex-1 bg-transparent px-8 py-5 outline-none font-black text-2xl"/><button onClick={submitText} className="bg-indigo-600 text-white px-10 py-5 rounded-[2rem] font-black hover:bg-indigo-500 transition-all">{t.submit}</button></div>}
                {state==='playing' && <button onClick={()=>gm.claim(idx, true)} className="w-full text-slate-600 hover:text-rose-500 text-[10px] font-black uppercase tracking-widest flex items-center justify-center transition-all"><SkipForward className="w-4 h-4 mr-2"/> {t.skip}</button>}
                {state==='result' && <div className="bg-slate-800/90 p-8 rounded-[3rem] border border-slate-700 space-y-4 shadow-2xl animate-fade-in"><div className="flex justify-between items-center"><p className="text-white text-3xl font-black">{config.questionType==='choice'?cur.options[cur.correctIndex]:cur.acceptableAnswers[0]}</p></div><div className="h-px bg-slate-700"/>{cur.explanation && <p className="text-slate-400 text-sm leading-relaxed"><Lightbulb className="w-4 h-4 inline mr-2 text-yellow-500"/>{cur.explanation}</p>}{sources?.length>0 && <div className="flex flex-wrap gap-2">{sources.map((s,i)=><a key={i} href={s.uri} target="_blank" className="text-[10px] font-bold text-indigo-400 flex items-center bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700 hover:bg-white hover:text-slate-900 transition-all"><ExternalLink className="w-3 h-3 mr-1.5"/>{s.title||t.source}</a>)}</div>}</div>}
              </div>
            </div>
            <div className="mt-8 flex gap-4 overflow-x-auto scrollbar-hide py-2">{gm.players.sort((a,b)=>b.score-a.score).map(p=><div key={p.id} className={`shrink-0 flex items-center px-6 py-4 rounded-[2rem] border-2 transition-all ${p.id===gm.myId?'bg-indigo-600/20 border-indigo-500 shadow-lg':'bg-slate-800 border-slate-700 opacity-60'}`}><span className="text-3xl mr-4">{p.avatar}</span><div><div className="text-[10px] font-black text-slate-500 mb-1">{p.name}</div><div className="text-2xl font-black text-indigo-400">{p.score}</div></div></div>)}</div>
          </div>
        );
      };

      const LoadingView = ({ load }) => (
        <div className="flex-1 flex flex-col items-center justify-center p-8 text-center animate-fade-in">
          <div className="relative mb-16"><div className="absolute inset-0 bg-indigo-500/40 blur-[100px] animate-pulse rounded-full"/><Loader2 className="w-24 h-24 animate-spin text-indigo-500 relative z-10"/></div>
          <h2 className="text-white text-4xl font-black mb-8 italic tracking-tighter drop-shadow-lg">{load.m}</h2>
          <div className="w-full max-w-sm bg-slate-800 rounded-full h-3 border-2 border-slate-700 overflow-hidden shadow-2xl"><div className="bg-gradient-to-r from-indigo-600 to-indigo-400 h-full transition-all duration-300" style={{width: `${(load.c/load.t)*100}%`}}/></div>
          <p className="text-slate-600 mt-6 font-black uppercase tracking-[0.4em] font-mono">{load.c} / {load.t}</p>
        </div>
      );

      const ResultView = ({ gm, onRematch, onTop, t }) => (
        <div className="w-full max-w-2xl mx-auto p-4 flex flex-col items-center justify-center min-h-[80vh] animate-fade-in">
          <div className="glass w-full p-12 rounded-[4rem] text-center space-y-12 relative overflow-hidden shadow-2xl">
             <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-600 to-indigo-500"/>
             <h2 className="text-8xl font-black text-white italic tracking-tighter drop-shadow-2xl">{t.finish.toUpperCase()}</h2>
             <div className="space-y-4">{gm.players.sort((a,b)=>b.score-a.score).map((p,i)=><div key={p.id} className={`flex justify-between items-center p-8 rounded-[2.5rem] border-2 transition-all ${i===0?'bg-indigo-900/40 border-indigo-500 scale-105 shadow-2xl':'bg-slate-800/40 border-slate-700'}`}><div className="flex items-center"><span className={`text-3xl font-black w-10 text-left ${i===0?'text-yellow-400':'text-slate-600'}`}>{i+1}</span><span className="text-5xl mr-5">{p.avatar}</span><span className="text-white font-black text-3xl tracking-tight">{p.name}</span></div><div className="text-right"><div className="text-[10px] font-black text-slate-600 uppercase mb-1">SCORE</div><div className="text-5xl font-black text-indigo-400 tracking-tighter">{p.score}</div></div></div>)}</div>
             <div className="flex gap-6 pt-10"><button onClick={onRematch} className="flex-1 bg-white text-slate-900 text-2xl font-black py-6 rounded-[2rem] shadow-2xl transition-all hover:scale-105 active:scale-95">{t.rematch}</button><button onClick={onTop} className="flex-1 bg-slate-800 text-white text-2xl font-black py-6 rounded-[2rem] shadow-2xl transition-all hover:scale-105 active:scale-95">{t.top}</button></div>
          </div>
        </div>
      );

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
